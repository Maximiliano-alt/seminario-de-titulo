version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      # Add your API keys here or use an .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - USE_FAISS=true
      - LOG_LEVEL=INFO
    volumes:
      # Persist vector store data
      - ./vector_store:/app/vector_store
      # Persist static files
      - ./static:/app/static
    env_file:
      - .env # Optional: Load environment variables from .env file
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  vector_store:
  static_files:
